
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hampter Vision</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #171923;
      color: white;
      text-align: center;
    }
    .camera {
      position: relative;
      width: min(90vw, 640px);
      margin: 20px auto;
    }
    video { width: 100%; display: block; }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <h1>Hampter Vision </h1>
  <button id="start">Enable Camera</button>
  <button id="stop">Disable Camera</button>
  <p id="status">Camera off</p>
  <div class="camera">
    <video id="webcam" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <h2 id="action">Waiting for player...</h2>
  <script type="module" src="/src/main.js"></script>


</body>
</html>
