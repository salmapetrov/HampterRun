<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hampter Vision</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
</head>
<body>
  <canvas id="gameCanvas" width="900" height="500" aria-label="Hampter Vision game"></canvas>
  <aside class="camera-panel" aria-label="Webcam and body detection">

    <div class="camera">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="camera-controls">
      <button id="start">Enable Camera</button>
      <button id="stop">Disable Camera</button>
    </div>

    <p id="status" role="status">Camera off</p>

    <!-- Keep this for JavaScript compatibility, but hide it visually -->
    <h2 id="action">Waiting for player...</h2>

  </aside>
  <script type="module" src="/src/main.js"></script>


</body>
</html>
