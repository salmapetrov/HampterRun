<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hampter Vision</title>
  <link rel="stylesheet" href="/src/styles/styles.css" />
</head>
<body>
  <canvas id="gameCanvas" width="900" height="500" aria-label="Hampter Vision game"></canvas>
  <!-- How to play: shown over the canvas (not drawn in it) so the text stays sharp -->
  <img id="instructions" src="/assets/backgrounds/instructions.png" alt="How to play" hidden />
  <img id="credits" src="/assets/backgrounds/hampter-credits.png" alt="Credits" hidden />
  <aside class="camera-panel" aria-label="Webcam and body detection">

    <div class="camera">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="camera-controls">
      <button id="toggleCamera" type="button">Enable Camera</button>
    </div>


  </aside>
  <script type="module" src="/src/main.js"></script>


</body>
</html>
